<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do You Love Me?</title>
    <!-- Importing Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Ensuring smooth transitions and basic setup */
        body {
            font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            overflow: hidden; /* Prevent scrollbars when button dodges */
        }

        /* Custom Heartbeat Animation for the Yes Button */
        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            15% { transform: scale(1.05); }
            30% { transform: scale(1); }
            45% { transform: scale(1.05); }
            60% { transform: scale(1); }
        }
        
        .animate-heartbeat {
            animation: heartbeat 2s infinite;
        }

        /* Floating Hearts Animation Background */
        .heart {
            position: absolute;
            top: -10vh;
            font-size: 24px;
            color: rgba(255, 255, 255, 0.4);
            animation: fall linear forwards;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes fall {
            to {
                transform: translateY(110vh) rotate(360deg);
            }
        }

        /* Smooth UI transitions */
        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-[#ffc3c3] to-[#dea5a5] relative">

    <!-- Background Audio Loop -->
    <audio id="bg-music" loop>
        <source src="GVJ.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <!-- Mute Button -->
    <button id="mute-btn" class="fixed bottom-6 right-6 bg-white/40 hover:bg-white/70 text-gray-800 px-4 py-2 rounded-full backdrop-blur-md shadow-lg transition-all text-sm font-bold z-50 border border-white/50">
        Shut up 🔇
    </button>

    <!-- Main Question Container -->
    <div id="question-container" class="flex flex-col items-center justify-center text-center w-full transition-opacity duration-500 z-10 fade-in">
        
        <!-- Image Container with enhanced styling -->
        <div class="bg-white/90 backdrop-blur-sm w-64 h-64 rounded-3xl flex items-center justify-center mb-8 shadow-2xl border-4 border-white transform hover:scale-105 transition-transform duration-300">
            <img id="gif-img" src="" alt="Cute reaction gif" class="w-56 h-56 object-contain rounded-2xl" />
        </div>

        <!-- Texts -->
        <h1 id="heading" class="text-4xl md:text-5xl font-extrabold text-[#2a1b1b] mb-4 max-w-lg transition-all drop-shadow-sm"></h1>
        <p id="subtext" class="text-base md:text-lg text-[#5a3a3a] mb-10 font-semibold transition-all"></p>

        <!-- Buttons -->
        <div class="flex gap-6 items-center relative w-full justify-center" style="min-height: 60px;">
            <!-- Added container for dynamic scaling so layout doesn't break -->
            <div id="yes-btn-container" class="transition-transform duration-300 ease-in-out z-10">
                <button id="yes-btn" class="bg-white text-[#ff4b4b] px-10 py-3 rounded-full font-bold text-lg shadow-xl hover:bg-[#fff0f0] hover:shadow-2xl transition-all animate-heartbeat border-2 border-transparent hover:border-[#ff4b4b]">
                    Yes
                </button>
            </div>
            <button id="no-btn" class="bg-[#f3f4f6] text-gray-700 px-8 py-3 rounded-full font-bold shadow-md hover:bg-gray-200 transition-all border border-gray-300">
                No
            </button>
        </div>
        
    </div>

    <!-- Success Container (Hidden by default) -->
    <div id="success-container" class="hidden flex-col items-center justify-center w-full h-full z-10 fade-in">
        <div class="bg-white/90 backdrop-blur-sm rounded-full p-8 shadow-2xl mb-6 transform hover:scale-105 transition-transform duration-300">
            <img src="https://media.tenor.com/gUiu1zyxfzYAAAAi/bear-kiss-bear-kisses.gif" alt="Happy Kiss" class="w-72 h-72 object-contain" />
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // Data for each step exactly matching the provided screenshots
        const steps = [
            {
                gif: "https://media.tenor.com/6uDlJNk7khMAAAAM/puss-in-boots-eyes.gif",
                heading: "Do you love me? 🥰",
                subtext: "nvn is all yours"
            },
            {
                gif: "https://media.tenor.com/H1gpSxB6qvEAAAAM/please-please-please.gif",
                heading: "Please think again! 🙄",
                subtext: "itni jaldi na matt bolo😪"
            },
            {
                gif: "https://media.tenor.com/MgUMKz56Vy4AAAAM/happy-labour-day.gif",
                heading: "Ek aur baar Soch lo! 😣",
                subtext: "kyu aisa kar rahi ho Pls Maan jao🥺"
            },
            {
                gif: "https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExM3FmbXQ4eHZhb2VqZTJ4c2xzcjcyc2wzMXQ3bjN6cDNoYmVwaXhrdyZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/ghXitlPhJSsMzpAQvD/giphy.gif",
                heading: "beautiful pls Man jao na! Kitna code likh waogi😭",
                subtext: "bhut glt baat hai yrr😭"
            }
        ];

        let currentStep = 0;
        let yesScale = 1;

        // DOM Elements
        const gifImg = document.getElementById('gif-img');
        const heading = document.getElementById('heading');
        const subtext = document.getElementById('subtext');
        const yesBtn = document.getElementById('yes-btn');
        const yesBtnContainer = document.getElementById('yes-btn-container');
        const noBtn = document.getElementById('no-btn');
        const questionContainer = document.getElementById('question-container');
        const successContainer = document.getElementById('success-container');
        const bgMusic = document.getElementById('bg-music');
        const muteBtn = document.getElementById('mute-btn');

        // Audio Handling
        let isMuted = false;
        
        // Attempt to auto-play audio (browsers may block this until first interaction)
        const playAudio = () => {
            if (!isMuted) {
                bgMusic.volume = 0.4; // Soft background volume
                bgMusic.play().catch(e => console.log("Autoplay prevented. Waiting for user interaction."));
            }
        };

        // Try playing immediately
        playAudio();

        // Fallback: start audio on first click anywhere on the page if autoplay was blocked
        document.body.addEventListener('click', () => {
            if (bgMusic.paused && !isMuted) {
                playAudio();
            }
        }, { once: true });

        // Mute Button Logic
        muteBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // Prevent triggering the body click event
            isMuted = !isMuted;
            bgMusic.muted = isMuted;
            if(!isMuted && bgMusic.paused) {
                playAudio();
            }
            muteBtn.innerHTML = isMuted ? "Unmute 🔊" : "Shut up 🔇";
            muteBtn.classList.toggle('bg-red-100/80', isMuted);
        });

        // Function to update the UI based on the current step
        function updateUI() {
            // Add a quick fade effect when changing steps
            gifImg.classList.remove('fade-in');
            heading.classList.remove('fade-in');
            subtext.classList.remove('fade-in');
            
            // Trigger reflow
            void gifImg.offsetWidth;
            
            gifImg.classList.add('fade-in');
            heading.classList.add('fade-in');
            subtext.classList.add('fade-in');

            gifImg.src = steps[currentStep].gif;
            heading.innerText = steps[currentStep].heading;
            subtext.innerText = steps[currentStep].subtext;
        }

        // Function to make the "No" button jump around
        function moveNoButton() {
            const maxX = window.innerWidth - noBtn.offsetWidth - 20;
            const maxY = window.innerHeight - noBtn.offsetHeight - 20;
            
            const x = Math.max(20, Math.random() * maxX);
            const y = Math.max(20, Math.random() * maxY);
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
            noBtn.style.zIndex = '50';
        }

        // Background Floating Hearts Generator
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerText = ['💖', '💕', '💗', '💓', '💞'][Math.floor(Math.random() * 5)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 3 + 4 + 's'; // 4 to 7 seconds
            heart.style.fontSize = Math.random() * 20 + 10 + 'px';
            document.body.appendChild(heart);

            // Remove heart after it falls down
            setTimeout(() => {
                heart.remove();
            }, 7000);
        }

        // Continuously create background hearts
        setInterval(createHeart, 800);

        // Event Listeners for the "No" button
        noBtn.addEventListener('click', () => {
            // Make the "Yes" button progressively larger
            yesScale += 0.2;
            yesBtnContainer.style.transform = `scale(${yesScale})`;

            if (currentStep < steps.length - 1) {
                currentStep++;
                updateUI();
            } else {
                moveNoButton();
            }
        });

        // Add mouseover event to dodge the cursor on the final step
        noBtn.addEventListener('mouseover', () => {
            if (currentStep === steps.length - 1) {
                moveNoButton();
                // Optionally make the Yes button grow even faster when they try to catch the No button
                yesScale += 0.05;
                yesBtnContainer.style.transform = `scale(${yesScale})`;
            }
        });

        // Event Listener for the "Yes" button
        yesBtn.addEventListener('click', () => {
            questionContainer.classList.add('hidden');
            successContainer.classList.remove('hidden');
            successContainer.style.display = 'flex';
            
            // Speed up the hearts!
            setInterval(createHeart, 200);
        });

        // Initialize the first view
        updateUI();
    </script>
</body>
</html>
